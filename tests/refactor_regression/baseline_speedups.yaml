# Kernel speedup regression thresholds for the refactor.
#
# Source: docs/refactor/EXECUTION_PLAN.md §0.2, pulled directly from the live
# knowledge_base.json (version 7, 60+ recorded experiences) as of 2026-04-22.
#
# Any PR must maintain or improve these speedups on the listed kernels.
# Nightly test `tests/refactor_regression/test_kb_speedups.py` (stub today,
# full runner lands in PR-3) runs each kernel for 5 rounds × 1 seed and asserts
# best-of-5 >= threshold.
#
# Format: kernel_name: {best_observed, threshold, source_line_in_kb}

kernels:
  # --- Top tier (3x-5x+) ---
  gemm_a16w16_atomic:
    best_observed: 3.9183
    threshold: 3.5
    source_line: 962
    notes: "KB top entry; Triton gemm with atomic accumulation"

  llama_ff_triton:
    best_observed: 5.2364
    threshold: 4.7
    source_line: 5075

  three_nn:
    best_observed: 5.3813
    threshold: 4.8
    source_line: 1909
    notes: "HIP three_nn via memory transfer; highest observed speedup"

