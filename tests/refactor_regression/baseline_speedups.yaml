# Kernels that have been run but NOT yet in KB v7 — tracked here so they're on
# the nightly regression roster once KB is bumped:
tracked_not_in_kb:
  - ff_backward
  - gemm_a16wfp4
  - lean_atten_paged
  - mla_decode
  - refk_fp8_blockwise_mm

# Test runtime assumption: 4 GPUs × ~15 min avg per kernel-round.
# Nightly full sweep: 13 kernels × 5 rounds × 1 seed × 15 min / 4 GPUs ≈ 4 GPU-hours.
