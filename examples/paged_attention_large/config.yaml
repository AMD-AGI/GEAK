    \ clamp (captured cases now run at their real recorded max_seq_len with\
    \ self-consistent block tables) and the default performance run additionally\
    \ times a sweep of constructed memory-bound decode cases (disjoint KV blocks ->\
    \ real HBM streaming). Regenerate the large cases with scripts/gen_perf_cases.py."
