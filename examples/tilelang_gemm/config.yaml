compile_command:
- python3 -m py_compile kernel.py official_reference_kernel.py test_tilelang_gemm_harness.py
correctness_command:
- python3 test_tilelang_gemm_harness.py --correctness
performance_command:
- python3 test_tilelang_gemm_harness.py --full-benchmark
