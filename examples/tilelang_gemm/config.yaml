prompt:
  instructions: Optimize the controlled TileLang GEMM kernel for AMD MI300X GPU.
    The kernel is derived from the official tilelang-benchmark CDNA GEMM benchmark.
    The starting kernel intentionally worsens several official search-space constants
    and adds an unnecessary shared-memory output staging path, so GEAK can recover
    measurable performance through TileLang kernel-body and schedule optimizations.
