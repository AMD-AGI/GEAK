name: CI L0 — checks

# L0: cheap, fast, GPU-free checks that gate every push / PR.
# Runs entirely on GitHub-hosted ubuntu runners — no dataset, no GPU, no Claude,
# no secrets. The expensive GPU e2e lives in the self-hosted L1 workflow.

on:
  # The v4 line now lives on `main` (the default branch), so CI gates main.
  push:
    branches: ["main", "ci/**"]
  pull_request:
    # NOTE: ci/** is TEMPORARY (self-test via a PR whose base is a ci/** branch).
    # Revert to just ["main"] before real use.
    branches: ["main", "ci/**"]

# Supersede in-flight runs for the same ref (a new push cancels the old run).
concurrency:
  group: l0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Advisory only for now (the tree has pre-existing findings); surfaces
      # issues in the log without blocking merges. Flip to blocking once clean.
      - name: ruff check (non-blocking)
        continue-on-error: true
        run: ruff check .

      # Blocking, unlike ruff: the shell here is not advisory decoration, it is the
      # server-kill contract (server_teardown.sh) and the dispatcher that must find it.
      # A parse error there means the EXIT trap never binds and a served model is left
      # holding its VRAM and port. `bash -n` catches that in milliseconds; no shellcheck
      # dependency, so the job keeps its no-install-beyond-ruff shape.
      - name: bash syntax check (e2e shell contract)
        run: |
          find e2e_workflow/scripts kernel_workflow/scripts -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

  pytest:
    name: Python unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The performance corpus -- evidence, decision cards, axes -- lives in the knowledge
      # repository, and this repo holds only the logic that consumes it. The corpus consumer
      # tests come in two kinds: unit tests over a synthetic corpus in tmp_path, which need
      # nothing here, and integration tests of the seam, which assert against the real cards.
      #
      # Those second ones SKIP when KERNEL_KNOWLEDGE_DIR is unset rather than failing, so
      # without this step the job would stay green while the seam went unverified. That is the
      # failure mode worth spending a checkout on: the contract between the two repos --
      # schema version, the shared authoring-language vocabulary, every catalogued path
      # resolving -- is only ever exercised with both of them present.
      #
      # Unpinned on purpose. A pinned ref would check this repo against a corpus no lane uses, and
      # the contract's whole job is to notice when the two drift; a knowledge commit that breaks it
      # SHOULD turn this red, because it has already broken every lane. Pin a ref only to park a
      # known-bad corpus while it is being fixed, and say so here when you do.
      - uses: actions/checkout@v4
        with:
          repository: yueliu14/KernelWiki
          path: .knowledge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pyyaml is required, not optional: run_e2e.py parses the recipe envs: block
      # with it, and the recipe-env tests assert the string-preserving BaseLoader
      # path (typed scalars, folded multi-line EXTRA_<BE>_ARGS). Without it those
      # tests would silently exercise the degraded line-scanner fallback instead.
      # The experience-store tests read/write the on-disk meta.yaml format (that
      # module degrades to JSON without pyyaml, but then the test would be
      # asserting a format the real store never uses).
      - run: pip install pytest pytest-cov coverage pyyaml
      # CPU-only tests (no claude_agent_sdk / GPU); the expert-skill test also uses PyYAML.
      # Files are listed explicitly rather than discovered, so that adding a test
      # under examples/ (torch/triton + GPU) can never silently break this job.
      #
      # torch is deliberately NOT installed here: it is optional in these tests and
      # only the CUDA-dependent assertions need it, which belong on L1's GPU runner.
      # Installing it would add minutes to a job that currently finishes in seconds.
      #
      # --cov-fail-under=0 defers the gate to the dedicated step below, so a
      # coverage shortfall is reported as its own named, legible failure rather
      # than as trailing output on the test step.
      #
      # test_effective_config / test_bench_replica_lifecycle arrived with the Hyperloom
      # alignment work and test_roofline_skill / test_vllm_adapter_profiler_config predate
      # it; none were ever added here. Because the list is explicit, a test file that is
      # never named is a test file that never runs — the same trap the contract checks
      # below were added to close. They also measure the modules that were dragging the
      # coverage gate down, which is what a suite nothing runs looks like from the outside.
      # `pytest`, NOT `python -m pytest`: `-m` puts the invocation directory on
      # sys.path[0], and this repo tracks a root-level `unittest.py` (the task-harness
      # entry-point convention — the oracle task dirs have one). That shadows stdlib
      # `unittest`, so anything importing `unittest.mock` — pytest's own startup on some
      # versions, or torch, which L1 installs — dies with
      #   ModuleNotFoundError: No module named 'unittest.mock'; 'unittest' is not a package
      # Reproduced on box 2026-10-13: `python -m pytest` from the repo root fails before
      # collection; the console script, which does not prepend cwd, passes. This job is
      # green today only because its pytest build happens not to take that import path
      # and torch is deliberately not installed here — neither is a property to rely on.
      - name: unit tests (no GPU)
        env:
          # The corpus checked out above. Same variable kernel_lane.js resolves, so a lane and
          # this job agree on which corpus they are talking about.
          KERNEL_KNOWLEDGE_DIR: ${{ github.workspace }}/.knowledge/perf_knowledge
        run: |
          pytest -q --cov --cov-report=term --cov-fail-under=0 \
            interface/test_run_e2e_recovery.py \
            interface/test_e2e_checkpoint.py \
            interface/test_run_e2e_tuning_result.py \
            interface/test_run_e2e_alignment.py \
            interface/test_run_e2e_dispatch.py \
            interface/test_run_e2e_runtime_dispatch.py \
            interface/test_run_e2e_workload_comparability.py \
            interface/test_run_e2e_recipe_env.py \
            interface/test_run_e2e_margin.py \
            interface/test_run_e2e_measurement_basis.py \
            interface/test_run_e2e_kb_write_tuned.py \
            e2e_workflow/scripts/tests/test_atom_adapter_lifecycle.py \
            e2e_workflow/scripts/tests/test_atom_server_argv.py \
            interface/test_run_e2e_trace_mirror.py \
            interface/test_geak_outcome_report.py \
            interface/tests/test_geak_call_tree_html.py \
            interface/tests/test_geak_report.py \
            interface/tests/test_claude_trace_mirror.py \
            interface/tests/test_no_hyperloom_dependency.py \
            interface/tests/test_geak_trace_collector.py \
            interface/tests/test_geak_trace_events.py \
            interface/tests/test_geak_trace_report.py \
            interface/tests/test_tracker_wiring.py \
            e2e_workflow/scripts/tests/test_agentx_profile_and_mapper.py \
            e2e_workflow/scripts/tests/test_agentx_smoke.py \
            e2e_workflow/scripts/tests/test_bench_env_channel.py \
            e2e_workflow/scripts/tests/test_magpie_launcher_extra_args.py \
            e2e_workflow/scripts/tests/test_magpie_inner_reap.py \
            e2e_workflow/scripts/tests/test_bench_trust_remote_code.py \
            e2e_workflow/scripts/tests/test_workload_alignment.py \
            e2e_workflow/scripts/tests/test_run_correctness_gate.py \
            e2e_workflow/scripts/tests/test_parse_regime_sources.py \
            e2e_workflow/scripts/tests/test_gsm8k_eval.py \
            e2e_workflow/scripts/tests/test_parse_profile.py \
            e2e_workflow/scripts/tests/test_capture_shapes.py \
            e2e_workflow/scripts/tests/test_llm_ledger.py \
            e2e_workflow/scripts/tests/test_overlay_setup.py \
            e2e_workflow/scripts/tests/test_overlay_injection_runtime.py \
            e2e_workflow/scripts/tests/test_overlay_installers.py \
            e2e_workflow/scripts/tests/test_seam_trace.py \
            e2e_workflow/scripts/tests/test_seam_trace_capture_guard.py \
            e2e_workflow/scripts/tests/test_kernel_selection.py \
            e2e_workflow/scripts/tests/test_kernel_extract_targets.py \
            e2e_workflow/knowledge/kernel_extraction_skills/kernel-extract/tests/test_sampling_pipeline.py \
            e2e_workflow/scripts/tests/test_kernel_extract_gpu_isolation.py \
            e2e_workflow/scripts/tests/test_attribute_weights_edges.py \
            e2e_workflow/scripts/tests/test_op_bench.py \
            e2e_workflow/scripts/tests/test_harness_lib.py \
            e2e_workflow/scripts/tests/test_observed_workload_weights.py \
            e2e_workflow/scripts/tests/test_leg_runner.py \
            e2e_workflow/scripts/tests/test_server_teardown.py \
            e2e_workflow/scripts/tests/test_bench_e2e_teardown_lookup.py \
            e2e_workflow/scripts/tests/test_run_reaper.py \
            e2e_workflow/scripts/tests/test_tuning_skillset_sync.py \
            ci/node/test_run_model_material_audit.py \
            perf_knowledge/expert_skills/_contribute/test_flydsl_skill_portability.py \
            perf_knowledge/expert_skills/_contribute/test_tuning_index.py \
            e2e_workflow/scripts/tests/test_e2e_store.py \
            e2e_workflow/scripts/tests/test_kb_retract.py \
            kernel_workflow/scripts/tests/test_experience_store.py \
            kernel_workflow/scripts/tests/test_eval_storage_reclaim.py \
            kernel_workflow/scripts/tests/test_workspace_sources.py \
            kb/tests/test_store_local.py \
            kb/tests/test_attest.py \
            kb/tests/test_identity.py \
            kb/tests/test_store_read_only.py \
            kernel_workflow/scripts/tests/test_kb_loop_offline.py \
            interface/test_effective_config.py \
            e2e_workflow/scripts/tests/test_bench_replica_lifecycle.py \
            e2e_workflow/scripts/tests/test_bench_summarize.py \
            e2e_workflow/scripts/tests/test_inferencex_client_warmup_parity.py \
            e2e_workflow/scripts/tests/test_agentx_client_canonicality.py \
            e2e_workflow/scripts/tests/test_roofline_skill.py \
            e2e_workflow/scripts/tests/test_vllm_adapter_profiler_config.py \
            e2e_workflow/scripts/tests/test_profile_env_shim.py \
            scripts/tests/test_gpu_identity.py \
            e2e_workflow/scripts/tests/test_bench_warm_server_lifecycle.py \
            kb/tests/test_curate.py \
            kb/tests/test_plane.py \
            perf_knowledge/expert_skills/_contribute/test_validation_env.py \
            perf_knowledge/languages/flydsl/test_version_map.py \
            perf_knowledge/index/test_run_recurrence.py \
            perf_knowledge/corpus/test_candidate_selection.py \
            perf_knowledge/corpus/test_decision_outcomes.py \
            perf_knowledge/corpus/test_workflow_products.py \
            kernel_workflow/scripts/test_detect_language.py \
            kernel_workflow/scripts/test_capture_validation_env.py \
            geak/test_bootstrap.py \
            kernel_workflow/scripts/test_check_flydsl_compat.py \
            kernel_workflow/scripts/test_upstream_knobs.py \
            kb/tests/test_store_env.py \
            perf_knowledge/corpus/test_benchmark_adapter.py \
            perf_knowledge/corpus/test_benchmark_registry.py \
            perf_knowledge/corpus/test_implementation_selection.py \
            ci/test_ci_test_inventory.py \
            ci/test_standalone_contracts.py

      # Advisory, on the same reasoning as the ruff step: three skills declare `validated` while
      # pointing at no measurement record, and a record cannot be invented for a run nobody archived.
      # Blocking on it today would only teach people to delete the check. The three artifacts that DO
      # exist are held clean by test_validation_env.py in the suite above, so this step exists to keep
      # the remaining gap visible in the log rather than to gate.
      - name: validated skills state their measurement environment (advisory)
        continue-on-error: true
        run: python3 perf_knowledge/expert_skills/_contribute/check_validation_env.py

      - name: expert skill static validation
        run: |
          for skill in \
            flydsl_decode_moe_stage1_blkmap \
            flydsl_prefill_moe_stage2_fp8partial \
            flydsl_fp8_blockscale_gemm
          do
            python perf_knowledge/expert_skills/_contribute/validate_skill.py "$skill" --static
          done

      # Standalone contract checks. NOT in the pytest list above: each runs its assertions at import
      # time and exits non-zero, which pytest collection cannot express. They were added with the
      # learned-KB work and were not wired into CI at all — a regression suite nothing runs is a
      # comment. Reported in review of #411.
      - name: KB and workflow contract checks
        run: |
          set -e
          python3 kernel_workflow/scripts/test_kb.py
          python3 kernel_workflow/scripts/test_lane_refs.py
          python3 kernel_workflow/scripts/test_kb_switch.py
          bash kernel_workflow/scripts/test_profile_policy.sh
          bash kernel_workflow/scripts/test_profile_fallback.sh
          bash kernel_workflow/scripts/test_detect_gpu_arch.sh
          bash kernel_workflow/scripts/test_gpu_lock_arch.sh
          # The read half of the knowledge loop. Nothing else checks it: a generated artifact can
          # pass every --check gate above while no role prompt names it, which is how run_recurrence,
          # the corpus and version_map were all built, tested, gated — and unreachable by the agent
          # that plans directions. A doc no role reads is a comment with a CI gate on it.
          python3 kernel_workflow/scripts/test_knowledge_reachable.py
          # The two structural promises perf_knowledge/README.md makes about itself. They had been
          # advertised in its banner and checked by nothing; the first run found 25 content files with
          # no `## Sources`, so the banner had been wrong for a while with nothing to say so.
          python3 perf_knowledge/test_docs_contract.py
          python3 e2e_workflow/scripts/tests/test_e2e_lane_defaults.py
          python3 e2e_workflow/scripts/tests/test_kb_identity_flags.py
          # The kernel KB must lint clean and its generated index must match the cards. `lint --cards`
          # now exits non-zero on failure, so this is a gate rather than a printout.
          python3 kernel_workflow/scripts/kb.py --kb-dir kernel_workflow/knowledge/learned lint --cards
          python3 kernel_workflow/scripts/kb.py --kb-dir kernel_workflow/knowledge/learned index --check
          # Same rule one level up: the perf_knowledge roll-up of those cards is generated, so a
          # commit that adds a card and not the regenerated digest is a tree where the curated base
          # and the cards disagree. Gated rather than advisory because the fix is one command.
          python3 perf_knowledge/index/_gen_run_recurrence.py --check
          # The same rule for the operator corpus is NOT run here any more, and the omission is
          # deliberate rather than a gap. `_render_facts.py --check` and `_render_decisions.py --check`
          # assert that a rendered page still matches the evidence it was generated from — a claim
          # about the knowledge repository's own contents, made true or false only by commits there.
          # Gating it in this repo would mean a GEAK PR going red for an edit it did not make, and a
          # knowledge PR going green for one it did. So that gate moved with the artifact, to
          # KernelWiki's ci-corpus-checks workflow. What stays here is the seam: the unit-test step
          # above checks the corpus out and runs the consumer's integration tests against it.

      # Renders the per-file table + total into the run's Job Summary, which is
      # where the coverage percentage is read from the GitHub web UI. Runs even
      # when the suite failed, so a red run still shows what was measured.
      - name: Coverage summary
        if: always()
        run: |
          python3 <<'PY'
          import os, pathlib, subprocess, sys, tomllib

          cfg = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          gate = int(cfg["tool"]["coverage"]["report"].get("fail_under", 0))
          out = [f"## Coverage (gate: {gate}%)", ""]

          if not pathlib.Path(".coverage").exists():
              out += ["No `.coverage` data — the test step did not produce a measurement."]
          else:
              txt = subprocess.run(
                  ["coverage", "report", "--skip-empty"],
                  capture_output=True, text=True, check=False,
              ).stdout or ""
              print(txt)  # full report stays in the step log
              rows, total = [], None
              for line in txt.splitlines():
                  parts = line.split()
                  if len(parts) < 4 or line.startswith(("Name", "-")):
                      continue
                  try:
                      stmts, miss = int(parts[-3]), int(parts[-2])
                  except ValueError:
                      continue
                  name = " ".join(parts[:-3])
                  if name == "TOTAL":
                      total = (stmts, miss, parts[-1])
                  else:
                      rows.append((name, stmts, miss, parts[-1]))
              if total:
                  pct = float(total[2].rstrip("%"))
                  mark = "✅" if pct >= gate else "❌"
                  out += [f"**{mark} {total[2]}** of {total[0]} statements "
                          f"({total[1]} uncovered). Gate is {gate}%.", ""]
              # Worst-covered first: this is the to-do list for raising the gate.
              rows.sort(key=lambda r: float(r[3].rstrip("%")))
              out += ["| File | Stmts | Miss | Cover |", "|---|---:|---:|---:|"]
              out += [f"| `{n}` | {s} | {m} | {c} |" for n, s, m, c in rows]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              pathlib.Path(summary).write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      # The gate itself. Reads fail_under back out of pyproject.toml so the
      # threshold has exactly one home. No `if:` — a failed suite skips this,
      # since coverage from a partial run would be meaningless.
      # COVERAGE_RELAX_FAIL_UNDER=1 (repo variable) bypasses it in an emergency.
      - name: Enforce coverage gate
        env:
          COVERAGE_RELAX_FAIL_UNDER: ${{ vars.COVERAGE_RELAX_FAIL_UNDER }}
        run: |
          python3 <<'PY'
          import os, pathlib, subprocess, sys, tomllib

          if (os.environ.get("COVERAGE_RELAX_FAIL_UNDER") or "").strip().lower() in {"1", "true", "yes", "on"}:
              print("::notice::COVERAGE_RELAX_FAIL_UNDER set — coverage gate not enforced.")
              sys.exit(0)
          if not pathlib.Path(".coverage").exists():
              print("::error::No .coverage data for the coverage gate.")
              sys.exit(1)
          cfg = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          gate = int(cfg["tool"]["coverage"]["report"].get("fail_under", 0))
          r = subprocess.run(["coverage", "report", f"--fail-under={gate}", "--skip-empty"])
          if r.returncode:
              print(f"::error::Coverage is below the {gate}% gate. Add tests, or see "
                    "pyproject.toml [tool.coverage.report].")
          sys.exit(r.returncode)
          PY

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scans the WORKING TREE, not git history: actions/checkout fetches a single
      # commit by default, so a history scan here would be meaningless. This is the
      # gate that stops a NEW secret from landing. Known false positives are
      # allowlisted in .gitleaks.toml.
      # The upstream binary is used directly rather than gitleaks-action, which
      # requires a paid license key for organization-owned repos.
      - name: gitleaks (working tree)
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks dir . --no-banner --redact --config .gitleaks.toml

  node-regression:
    name: Node regression (expert_skills, kernel canonicalization, tuning phase, time budget, workload declaration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Proves the use_expert_skills=OFF path injects nothing (byte-identical).
      # Pure node (fs/path only) — no npm install needed.
      - name: expert_skills OFF-identical regression
        run: node e2e_workflow/scripts/test_expert_skills_off_identical.js
      - name: Candidate coverage and independent speedup review regression
        run: node --test e2e_workflow/scripts/test_speedup_review.js
      - name: AgentX-only kernel extraction and fixed-load compatibility
        run: |
          set -e   # without this only the LAST line's exit code is the step's verdict
          node e2e_workflow/scripts/test_kernel_extract_skill.js
          node e2e_workflow/scripts/test_agentx_baseline_selection.js
          node --test e2e_workflow/scripts/test_kernel_extraction_delivery.mjs
          node --test e2e_workflow/scripts/test_kernel_source_delivery.mjs
          node --test e2e_workflow/scripts/test_agentx_standalone_handoff.mjs
      - name: candidate floor and invalid measurement recovery
        run: node kernel_workflow/scripts/test_candidate_floor.js
      # The JS gate and the Python selection verdict canonicalize the same kernel symbols. Only this
      # job can run the JS half, so without it the two implementations are pinned on the Python side
      # alone and are free to drift — which lets a kernel pass one side and be refused by the other.
      # The Python half is TestTheSharedFixtureHoldsOnThisSide in tests/test_kernel_selection.py.
      - name: kernel canonicalization JS/Python parity
        run: node e2e_workflow/scripts/test_kernel_canonicalization_parity.js
      - name: head entity_kind adopted from the profiled row
        run: node e2e_workflow/scripts/test_head_entity_kind_adoption.js
      # Structural guard on the TuningSkillset phase: the accept bars, the overlay
      # carry-forward, and the deploy-bundle handoff to finalize. Node + git only.
      - name: tuning skillset phase regression
        run: node e2e_workflow/scripts/test_tuning_skillset_phase.js
      # The elapsed clock and the final reserve are the only thing standing between a
      # long run and a hard kill with no report (Hyperloom #1202). Only this job can
      # exercise the JS half, and the clock is pure time arithmetic — no GPU, no model.
      - name: wall-clock budget / final reserve regression
        run: node e2e_workflow/scripts/test_time_budget_reserve.js
      # The final phase measures on GPUs the search may still hold: the tuning window and the
      # run_reaper.py fence ahead of Finalize and Validate. No GPU, no model.
      - name: final-phase GPU handover regression
        run: node e2e_workflow/scripts/test_final_phase_gpu_handover.js
      - name: gfx1201 fail-closed knowledge regression
        run: node kernel_workflow/scripts/test_rdna4_policy.js
      - name: R9700 E2E identity and knowledge policy
        run: node e2e_workflow/scripts/test_rdna4_e2e_policy.js
      - name: caller-pinned eval_dir regression
        run: node e2e_workflow/scripts/test_pinned_eval_dir.js
      - name: kernel_workflow mode dispatch / R9700 bakeoff isolation
        run: node kernel_workflow/scripts/test_mode_dispatch.js
      # Extraction smoke must be exactly "pass"/"fail": a prose "PASS (exit 0) ..." once read as a
      # failed extraction and silently dropped heads whose unittest had passed.
      - name: extraction smoke status contract
        run: node e2e_workflow/scripts/test_smoke_status_contract.js
      # Standalone GEAK has no orchestrator to export BENCH_CLIENT / E2E_METRIC / AGENTX_*, so the
      # workflow declares the workload itself. Two things must hold and only node can check them:
      # an absent declaration leaves the fixed ISL/OSL path byte-identical, and a present one only
      # ever assigns an unset name so an orchestrated run's exported values still win.
      - name: standalone workload declaration regression
        run: node e2e_workflow/scripts/test_agentx_declaration.js
      # The acceptance noise band decides what counts as a win, and the 0.5% default was measured
      # on fixed-shape work. A trace replay's replica spread is ~7x that, so the band is scoped per
      # workload and the Director's 0.5 cannot undercut it; this evaluates the real source and also
      # checks a fixed-shape run is unchanged.
      - name: acceptance noise band scoping
        run: node e2e_workflow/scripts/test_noise_band_scope.js
      # Simulated speculative acceptance makes the reference irreproducible, and the hung-agent guard
      # cannot stop the agent it gives up on. Both policies are opt-in; this also checks a run that
      # sets neither sees byte-identical prompts and the old retry.
      - name: correctness probes off simulated acceptance / hung-agent retry policy
        run: node e2e_workflow/scripts/test_correctness_probe_env.js
      # The joins between the pieces above: the real declaration, staged the way director.md says,
      # through bench_e2e.sh, the agentx client, the vendored mapper, bench_summarize.py and the
      # workflow's Setup check, with only the server and aiperf stubbed. Bash + python3 from the
      # runner image; no GPU, no model, no network.
      - name: standalone AgentX trace replay end to end
        run: node e2e_workflow/scripts/test_agentx_standalone_e2e.js

  tuning-skillset-integrity:
    name: Vendored tuning skillset matches its manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The skillset is vendored WHOLE so its standalone validation applies to what GEAK runs.
      # This is the gate that catches drift between the committed tree and the manifest —
      # including a file the committer can see locally but .gitignore kept out of the commit.
      # Stdlib only; no GPU, no network.
      - name: verify vendored tree against manifest
        run: python3 e2e_workflow/scripts/tuning_skillset_sync.py --verify

  dry-run:
    name: run_e2e dry-run mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Validates the handoff -> e2e_workflow.js args mapping against a committed
      # fixture (ci/fixtures/handoff.dry.json), so it needs no geak_runtime
      # dataset, GPU, or Claude. Guards the map_args / build_prompt code path.
      - name: handoff -> args mapping (fixture)
        run: |
          pip install pyyaml
          GEAK_STRICT_RECIPE_ENV=1 python interface/run_e2e.py \
            ci/fixtures/handoff.dry.json /tmp/l0_result.json --dry-run \
            > /tmp/geak-l0-dry-run.json
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("/tmp/geak-l0-dry-run.json").read_text())
          assert plan["bench_launcher"] == "magpie"
          assert plan["magpie_launch_script_source"] == "handoff"
          assert plan["recipe_env_source"] == "ci/fixtures/baseline_config.with_envs.yaml"
          replay = Path(plan["recipe_env_file"])
          assert replay.is_file(), replay
          raw = replay.read_bytes()
          assert raw.endswith(b"\0")
          entries = dict(item.split(b"=", 1) for item in raw.split(b"\0")[:-1])
          assert b"PORT" not in entries
          assert b"ROCR_VISIBLE_DEVICES" not in entries
          assert b"HIP_VISIBLE_DEVICES" not in entries
          assert b"CUDA_VISIBLE_DEVICES" not in entries
          assert entries[b"PATH"] == b"/usr/bin:/bin"
          extra = entries[b"EXTRA_VLLM_ARGS"]
          assert b"--trust-remote-code" in extra
          assert b'{"method":"ngram","num_speculative_tokens":3}' in extra
          PY
