name: CI L1 — SPUR e2e (smoke + verify)

# L1: real GEAK e2e on the SPUR (SLURM) cluster. The self-hosted runner lives on
# the JUMP/LOGIN box; it does NOT touch a GPU itself — it submits SPUR batch jobs
# (one per model) that allocate GPUs (tp from each handoff.json) on compute nodes,
# stage weights, and run the container workflow. See ci/README.md.
#
# Two label-gated tiers (a human applying the label is the GPU-cost gate):
#   - `l1-ci-smoke` -> L1 SMOKE : one SPUR job for the tier==smoke model.
#   - `l1-ci-full` -> L1 VERIFY: one SPUR job per enrolled model, matrix waited
#     on and aggregated (the check goes red if any model fails).
# workflow_dispatch offers the same two tiers on demand (once this file is on the
# default branch, so the "Run" button appears).
#
# IMPORTANT: the self-hosted runner must be installed under a shared filesystem
# path (e.g. /home/ethany/...) so the GEAK checkout it produces is readable by the
# SPUR compute nodes that run the job body (ci/dispatch/slurm_job.sh).

on:
  pull_request:
    types: [labeled]
    # NOTE: ci/** is TEMPORARY (self-test via a PR whose base is a ci/** branch).
    # Revert to just ["main"] before real use.
    branches: ["main", "ci/**"]
  workflow_dispatch:
    inputs:
      tier:
        description: "Which tier to run"
        type: choice
        # probe = infra-only harness check (real SPUR/docker/GPU/weights, stops at
        # the GEAK e2e doorstep) over the local-weight models. Fast, no e2e run.
        options: ["probe", "smoke", "verify"]
        default: "smoke"
      budget_s:
        description: "Per-model GEAK budget in seconds (PERFSKILLS_E2E_TIMEOUT_S). Leave empty to use the workflow default (env.GEAK_E2E_BUDGET_S)."
        type: string
        default: ""

# Serialize L1 on this repo — the matrix waits on its SPUR jobs, so we don't want
# two overlapping label/dispatch events double-submitting to the shared cluster.
concurrency:
  group: l1-spur-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Single source of truth for the per-model GEAK budget (PERFSKILLS_E2E_TIMEOUT_S).
  # Both jobs use `inputs.budget_s || env.GEAK_E2E_BUDGET_S`, so leaving the manual
  # dispatch field empty (and every label-triggered run) uses this value. Change it
  # here once. (Input defaults can't reference env, so the dispatch input default is
  # empty and falls through to this.)
  GEAK_E2E_BUDGET_S: "57600"
  # Data workspace on the jump box (siblings live here; NOT under the checkout).
  WS: /home/ethany/geak_ci_workspace
  HF_LOGS: /home/ethany/geak_ci_workspace/geak_runtime
  INFERENCEX_PATH: /home/ethany/geak_ci_workspace/InferenceX
  # Claude auth for the in-container worker; propagated to the SPUR job via
  # sbatch --export=ALL. Falls back to ci/preflight/claude_setup.sh defaults if absent.
  LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
  LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL }}
  # run_matrix.sh records each submitted SPUR job id here; the cleanup step reads
  # it to scancel orphans if this GitHub job is cancelled or times out.
  # NB: use github.workspace (NOT runner.temp) — the `runner` context is not
  # available in workflow-level env: and makes the whole workflow fail to compile.
  SPUR_JOBS_FILE: ${{ github.workspace }}/.spur_jobs_${{ github.run_id }}.txt

jobs:
  probe:
    name: L1 probe (SPUR infra-only, stops at GEAK entry)
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.tier == 'probe'
    runs-on: self-hosted
    # Infra-only: real allocation + image pull + weights (+Claude), no e2e workflow.
    timeout-minutes: 120
    steps:
      - name: Checkout code under test
        uses: actions/checkout@v4
      - name: Preflight (SPUR reachable + dataset present)
        run: |
          set -e
          command -v sbatch >/dev/null || { echo "::error::sbatch not on PATH (SPUR jump box?)"; exit 1; }
          sinfo -p amd-spur -h >/dev/null || { echo "::error::cannot reach SPUR controller"; exit 1; }
          test -d "$HF_LOGS" || { echo "::error::missing dataset dir $HF_LOGS"; exit 1; }
      - name: Submit + wait L1 probe (local-weight models)
        run: bash ci/dispatch/run_matrix.sh probe
      - name: Cancel SPUR jobs if cancelled/timed out
        if: cancelled()
        run: |
          f="$SPUR_JOBS_FILE"
          [ -f "$f" ] || { echo "no SPUR job file ($f) — nothing to cancel"; exit 0; }
          ids="$(tr '\n' ' ' < "$f")"
          if [ -n "${ids// /}" ]; then echo "scancel $ids"; scancel $ids || true; else echo "no job ids recorded"; fi

  smoke:
    name: L1 smoke (SPUR, single model)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tier == 'smoke')
      || github.event.label.name == 'l1-ci-smoke'
    runs-on: self-hosted
    # Smoke uses the SAME budget + wall as full verify (a single-model full run), so
    # it isn't cut short mid-optimization.
    #
    # timeout-minutes is the ONLY outer backstop. By design run_matrix.sh waits on
    # PENDING jobs INDEFINITELY (no pending-timeout) — a congested cluster just means
    # a longer wait, not a failure. So this cap must cover: a long queue wait +
    # the run wall + overhead.
    #   - queue wait  : unbounded in code; operator cancels a job by hand if it pends
    #                   too long (>~36h). Budget ~36h of pend here.
    #   - run wall    : SPUR -t = budget + SPUR_TIME_HEADROOM_S
    #                   = 57600 + 7200 = 64800s = 1080 min = 18h
    #                   -> run_local.sh watchdog docker-kills the container ~5 min
    #                      before this and writes timeout.json (judged FAIL)
    # worst case ~= pend (36h=2160) + run wall (18h=1080) + submit/pull/judge (~60)
    #            ~= 3300 min. We set 3600 min (60h) for headroom so GitHub never
    # pre-empts a legitimate (even long-pending) run. Kept finite so a truly hung
    # harness can't block the single self-hosted runner forever. On timeout, the
    # cleanup step + run_matrix's SIGTERM trap scancel any jobs still submitted.
    timeout-minutes: 3600
    steps:
      - name: Checkout code under test
        uses: actions/checkout@v4
      - name: Preflight (SPUR reachable + dataset present)
        run: |
          set -e
          command -v sbatch >/dev/null || { echo "::error::sbatch not on PATH (SPUR jump box?)"; exit 1; }
          sinfo -p amd-spur -h >/dev/null || { echo "::error::cannot reach SPUR controller"; exit 1; }
          test -d "$HF_LOGS" || { echo "::error::missing dataset dir $HF_LOGS"; exit 1; }
      - name: Submit + wait L1 smoke
        run: |
          BUDGET="${{ github.event.inputs.budget_s || env.GEAK_E2E_BUDGET_S }}"
          bash ci/dispatch/run_matrix.sh smoke --budget "$BUDGET"
      # Backstop: run_matrix.sh scancels on graceful SIGTERM, but if it was
      # SIGKILLed (hard timeout) this cleans up any SPUR jobs it had submitted.
      - name: Cancel SPUR jobs if cancelled/timed out
        if: cancelled()
        run: |
          f="$SPUR_JOBS_FILE"
          [ -f "$f" ] || { echo "no SPUR job file ($f) — nothing to cancel"; exit 0; }
          ids="$(tr '\n' ' ' < "$f")"
          if [ -n "${ids// /}" ]; then echo "scancel $ids"; scancel $ids || true; else echo "no job ids recorded"; fi

  verify:
    name: L1 verify (SPUR, full matrix)
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tier == 'verify')
      || github.event.label.name == 'l1-ci-full'
    runs-on: self-hosted
    # Full matrix fans out one SPUR job per model and waits on all of them. The jobs
    # run CONCURRENTLY, so the wall clock ~= a single run (NOT the sum of models);
    # different models may pend independently.
    #
    # timeout-minutes is the ONLY outer backstop (same rationale as `smoke`).
    # run_matrix.sh waits on PENDING jobs INDEFINITELY — it returns only once NO job
    # is pending or running; a job that crashes/cancels is logged and the rest are
    # still waited on. So this cap must cover a long queue wait + run wall + overhead:
    #   - queue wait  : unbounded in code; operator cancels a job by hand if it pends
    #                   too long (>~36h). Budget ~36h of pend here (per model, parallel).
    #   - run wall    : SPUR -t = budget + SPUR_TIME_HEADROOM_S
    #                   = 57600 + 7200 = 64800s = 1080 min = 18h (per model, in parallel)
    #                   -> run_local.sh watchdog docker-kills each container ~5 min
    #                      before its -t and writes timeout.json (judged FAIL)
    # worst case (parallel) ~= pend (36h=2160) + run wall (18h=1080) + submit/judge (~60)
    #   ~= 3300 min; we set 3600 min (60h) so GitHub never pre-empts a valid run.
    # Kept finite so a hung harness can't block the single self-hosted runner forever.
    # On timeout, the cleanup step + run_matrix's SIGTERM trap scancel submitted jobs.
    timeout-minutes: 3600
    steps:
      - name: Checkout code under test
        uses: actions/checkout@v4
      - name: Preflight (SPUR reachable + dataset present)
        run: |
          set -e
          command -v sbatch >/dev/null || { echo "::error::sbatch not on PATH (SPUR jump box?)"; exit 1; }
          sinfo -p amd-spur -h >/dev/null || { echo "::error::cannot reach SPUR controller"; exit 1; }
          test -d "$HF_LOGS" || { echo "::error::missing dataset dir $HF_LOGS"; exit 1; }
      - name: Submit + wait L1 verify matrix
        run: |
          BUDGET="${{ github.event.inputs.budget_s || env.GEAK_E2E_BUDGET_S }}"
          bash ci/dispatch/run_matrix.sh verify --budget "$BUDGET"
      # Backstop: run_matrix.sh scancels on graceful SIGTERM, but if it was
      # SIGKILLed (hard timeout) this cleans up any SPUR jobs it had submitted.
      - name: Cancel SPUR jobs if cancelled/timed out
        if: cancelled()
        run: |
          f="$SPUR_JOBS_FILE"
          [ -f "$f" ] || { echo "no SPUR job file ($f) — nothing to cancel"; exit 0; }
          ids="$(tr '\n' ' ' < "$f")"
          if [ -n "${ids// /}" ]; then echo "scancel $ids"; scancel $ids || true; else echo "no job ids recorded"; fi
