# Portable CODEX_HOME for the GEAK standalone runtime.
# setup.sh sets CODEX_HOME to this directory; codex then keeps its own state here
# (sessions, logs, sqlite) -- .gitignore keeps all of that out of the repo and
# tracks only this file, so the provider config travels with the checkout.
#
# Only a FALLBACK: with the default GEAK_CODEX_AUTOCONFIG=1 the runtime writes the
# provider via -c overrides and never reads the providers below. They apply when
# you set GEAK_CODEX_AUTOCONFIG=0.
#
# The API key is read from OPENAI_API_KEY at runtime (never stored here).

model_provider = "openai"
preferred_auth_method = "apikey"
# Default thinking level. codex's own scale is none|low|medium|high|xhigh — it has
# no "max", so xhigh IS the maximum here. The runtime injects the same value via
# `-c model_reasoning_effort=xhigh` (override with GEAK_CODEX_EFFORT, which also
# accepts max as an alias); this line is the fallback when GEAK_CODEX_AUTOCONFIG=0.
model_reasoning_effort = "xhigh"

# Official OpenAI (api.openai.com). Standard Bearer auth via OPENAI_API_KEY
# (sk-...); public CA, so NO shim, NO SSL_CERT_FILE, NO APIM header needed.
# This is the default above and the simplest provider.
# Set GEAK_CODEX_MODEL to a model your account serves over the Responses API.
[model_providers.openai]
name = "OpenAI official"
base_url = "https://api.openai.com/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"

# Optional: a gateway that cannot serve /v1/responses directly, reached through the
# local de-streaming shim (it de-streams, normalizes, and strips the namespace tool).
# Neither the AMD gateway nor api.openai.com needs this. To use it, start the shim
# with `GEAK_GW_BASE=<upstream> . interface/runtime/setup.sh` and select it with:
#   GEAK_CODEX_EXTRA_ARGS="-c model_provider=local_shim"
[model_providers.local_shim]
name = "gateway via responses-shim"
base_url = "http://127.0.0.1:8791/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
