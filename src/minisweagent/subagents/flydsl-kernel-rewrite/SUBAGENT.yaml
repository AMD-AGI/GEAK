name: flydsl-kernel-rewrite
description: >-
  Rewrite a hot GPU kernel into an optimized FlyDSL-targeted implementation for AMD
  MI300X/gfx942. Source-agnostic (Triton / PyTorch / HIP / CK input). Follows AMD's
  real recipe: author an optimized kernel (split-K, tiling, fused scaling/epilogue,
  per-(M,N,K) config), prefer aiter FlyDSL ops where they win on this arch, fall back to
  an optimized authored Triton kernel where FlyDSL has no edge (e.g. gfx942 block-scaled
  GEMM has no native MFMA). Parity-gated. Use for high-%GPU editable kernels (GEMM, MoE,
  linear-attention, norm) where a backend rewrite/author can beat the stock kernel.

execution_mode: inprocess

parameters:
  - name: task
    type: string
    description: >-
      Free-form task: the source kernel path, output path, harness/benchmark command,
      and the optimization goal. Shapes (M,N,K) and dtype if known.
    required: true

agent:
  system_template_file: SYSTEM_PROMPT.md
  language_match:
    extensions: [".py", ".cu", ".cuh", ".cpp", ".hip"]
    markers: ["@triton.jit", "tl.program_id", "__global__", "ck::", "import torch"]
    confidence_boost: 0.05
  instance_template: |
    Rewrite/author an optimized FlyDSL-targeted kernel for this goal: {{task}}

    Validate parity with `save_and_test` after every change; only a correct, faster kernel counts.
    Submit when correctness passes AND it beats baseline: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
  cost_limit: 0
  step_limit: 200
  use_skills: true
