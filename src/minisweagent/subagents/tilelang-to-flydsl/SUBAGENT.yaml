name: tilelang-to-flydsl
description: >-
  Translate TileLang GPU kernels to FlyDSL on AMD MI300X (gfx942).
  FlyDSL is one of the two preferred (most-optimized) targets on MI300X/gfx942: it ships preshuffle GEMM (`compile_preshuffle_gemm_a8`) and flash-attention (`build_flash_attn_func_module`) prebuilts that beat generic Triton/CK/HIP.
  Produces numerically identical results and preserves the source kernel's
  external interface (signature, output shape/dtype, get_inputs/get_init_inputs).

execution_mode: inprocess

parameters:
  - name: task
    type: string
    description: >-
      Free-form task description including the source TileLang kernel path,
      output path for the FlyDSL translation, and harness command for testing.
    required: true

agent:
  system_template_file: SYSTEM_PROMPT.md
  language_match:
    extensions: [".py"]
    markers: ["import tilelang", "T.Kernel"]
    confidence_boost: 0.1
  instance_template: |
    ## Translation Task

    {{task}}

    ## Workflow

    1. Read the source TileLang kernel to understand its computation and interface.
    2. Plan the FlyDSL translation by op type (GEMM / attention / reduction / elementwise).
    3. Write the FlyDSL translation to the specified output path.
    4. Test it with the harness command (`save_and_test`).
    5. If the test fails, read the error and fix.
    6. Once the test passes, submit: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`

    ## Important

    - Every response must contain exactly one action enclosed in triple backticks
    - Directory or environment variable changes are not persistent
    - Use `save_and_test` to validate your translation
    - FlyDSL IS installed — do NOT create shims or mock modules.

  cost_limit: 0
  step_limit: 200
  use_skills: true
