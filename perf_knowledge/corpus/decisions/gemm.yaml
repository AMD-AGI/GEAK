        mechanism: "scales staged through LDS with their own shared layouts; each MFMA partial multiplied by the current block's scales inside the loop"
        source_evidence: ["src_db2ae65ef56818a7", "src_1ba1837b9ca062ee", "src_927f1e26846a58fd"]
      - backend: "ck"
        mechanism: "an A/B-scale device operation (`DeviceGemmMultiD_ABScale_Xdl_CShuffle_V3`), plus a block-scale B-preshuffle variant"
        source_evidence: ["src_73c6170a2792b675", "src_6352032268991afb"]
      - backend: "asm"
        mechanism: "precompiled block-scale kernels with B preshuffled — the same six on gfx942 and gfx950, every one tile_n = 128 (one W scale group per tile) with tile_m 32 to 128 and split-capable; the launcher picks tile_m and a split per shape and multiplies the grid by the split"
        source_evidence: ["src_381f987b35a586b7", "src_b07a8dc43c913b9d", "src_3865c44e30f36de9", "src_fcf5d73d12271d55", "src_8866d3dbeb612f3a"]
    shipped_evidence: ["cfg_d2642e1347a53ea1", "cfg_3eff28954f18b5fe", "sel_f7e394faa23e37e6", "sel_f1384cc1069c9823"]
    references:
      - "operators/dense_gemm/numerics.md:36-52"
      - "operators/scaled_quant_gemm/tuning.md:50-57"
      - "operators/dense_gemm/numerics.md:59-63"
    measurement_evidence: []
    limitations:
      - "The per-block multiply is VALU work on every K block; whether it hides behind the MFMAs is a measurement."
      - "These are Triton and Gluon spellings; FlyDSL expresses the same loop with its own MFMA, vector and conversion ops."
      - "Triton's scale strides are its wrapper's layout choice; take the x_scale / w_scale shapes from the task's math contract rather than from Triton."

