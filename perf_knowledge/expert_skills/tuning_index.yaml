# tuning_index.yaml — the selector descriptor for the VENDORED tuning skillset.
#
# Why this file exists at all, given that every other expert skill declares its own selector fields in
# its skill.md frontmatter: the tuning skills are vendored from upstream and hash-pinned as ONE tree
# (e2e_workflow/knowledge/tuning_skillset.manifest.sha256). Adding GEAK-specific frontmatter inside
# `tuning/` would make the pin fail on every re-sync and turn a byte-exact vendoring into a fork. So the
# selector metadata lives OUT here, next to the index it feeds, and the tree underneath stays untouched.
#
# `scaffold.py --reindex` reads this file and merges the entries into index.yaml with `scope: tuning`,
# alongside the skills/ entries — same schema, same filter, same validation gate. Edit the metadata here;
# never edit index.yaml by hand.
#
# validation_status is NOT written here. It is computed at reindex time from validate/claims.py output:
# the four reports the skillset ships (`tuning/validate/report_*.json`) by default, or a fresh run
# (`--claims-report out.json`) when you want the status of the image you are actually in. A skill with a
# FAIL anywhere is demoted to `draft`; a skill with nothing but N/A is `unvalidated`, because an image
# that cannot answer has not answered. Only `validated` skills are auto-applied.

tree: tuning                     # relative to expert_skills/; the vendored, hash-pinned root

skills:
- id: tuning_core
  dir: tuning-core
  claims_skill: tuning-core
  summary: The universal six-step tuning loop — scope, baseline, search, correctness, engagement, A/B.
    Every other tuning skill specializes it; read it first.
  match:
    operator: '*'
    arch_class:
    - '*'
    gens:
    - gfx942
    - gfx950
    dtypes:
    - '*'
    regimes:
    - '*'
    backend:
    - '*'
  expects:
    engagement_proof: required
    ab_complete: required
    parity: required

- id: tuning_aiter
  dir: tuning-aiter
  claims_skill: tuning-aiter
  summary: Race hipblaslt/triton/flydsl/asm/torch through the gradlib tuner, write tuned CSVs where the
    runtime reads them, prove engagement with AITER_LOG_TUNED_CONFIG.
  match:
    operator: '*'
    arch_class:
    - '*'
    gens:
    - gfx942
    - gfx950
    dtypes:
    - bf16
    - fp16
    - fp8_e4m3
    - fp8_e4m3_fnuz
    regimes:
    - prefill
    - decode
    backend:
    - aiter
  expects:
    isolated_speedup_min: 1.05
    engagement_proof: required
    parity: required

- id: tuning_triton
  dir: tuning-triton
