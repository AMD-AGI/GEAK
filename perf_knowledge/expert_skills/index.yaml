# index.yaml — expert_skills selector (AUTO-MAINTAINED by _contribute/scaffold.py + validate_skill.py).
# Regenerate with:  python _contribute/scaffold.py --reindex
# NOT a ranking. Filter by (operator, gen, arch_class, [from->to], status==validated) -> MEASURE.
# Only 'validated' skills are auto-applied by the workflows (advisory priors, never override A/B).

schema: {id, file, scope, match, expects, validation_status}

skills:
- id: apply_flydsl_moe_to_vllm
  file: skills/apply_flydsl_moe_to_vllm/skill.md
  scope: e2e
  match:
    operator: fused_moe_grouped_gemm
    arch_class:
    - '*'
    gens:
    - gfx942
    dtypes:
    - int4_w4a16
    regimes:
    - prefill
    - decode
    from_backend: triton
    to_backend: flydsl
    profile_signature:
      op_name_regex: fused_moe_kernel_gptq_awq|invoke_fused_moe_wna16
      min_pct_gpu: 10.0
  expects:
    e2e_delta_min_pct: 1.0
    parity: required
  validation_status: validated
- id: ensure_flydsl
  file: skills/ensure_flydsl/skill.md
  scope: dependency          # build/dependency skill: makes flydsl importable; invoked BY the flydsl skills, not profile-matched
  match:
    needs: flydsl
    arch_class:
    - '*'
    gens:
    - gfx942
    - gfx950
    dtypes:
    - int4_w4a16
    - fp8_e4m3_fnuz
  validation_status: n/a
- id: flydsl_decode_moe_stage1_blkmap
  file: skills/flydsl_decode_moe_stage1_blkmap/skill.md
  scope: kernel
  match:
    operator: grouped_gemm_moe
    arch_class:
    - '*'
    gens:
    - gfx950
    dtypes:
    - mxfp4
    - fp4_e2m1
    - fp8_e4m3
    - fp8_e4m3_fnuz
    regimes:
    - decode
    from_backend: ''
    to_backend: ''
    profile_signature:
      op_name_regex: ''
      min_pct_gpu: 0.0
  expects:
    isolated_speedup_min: 1.05
    isolated_scope: stage-1 ISOLATED SEGMENT = the gate+up GEMM kernel PLUS the descriptor-producer kernel
      this recipe adds. Do not include pre-existing sort/align/quant helpers in this isolated gate; report
      the full stage-1 window separately. The producer has an unrelated name, so a GEMM-only filter drops
      it and overstates the win (1.124x GEMM-only vs 1.104x with producer on FlyDSL 0.2.2).
    e2e_delta_min_pct: 1.0
    parity: required
  validation_status: validated
- id: flydsl_fp8_blockscale_gemm
  file: skills/flydsl_fp8_blockscale_gemm/skill.md
  scope: kernel
  match:
    operator: dense_gemm
    arch_class:
    - '*'
    gens:
    - gfx950
    dtypes:
    - fp8_e4m3
    - fp8_e4m3_fnuz
    regimes:
    - prefill
    - decode
    from_backend: ck
    to_backend: flydsl
    profile_signature:
      op_name_regex: kernel_gemm_xdl.*blockscale|gemm_a8w8_blockscale
      min_pct_gpu: 0.0
  expects:
    isolated_speedup_min: 1.05
    e2e_delta_min_pct: 1.0
    parity: required
  validation_status: validated
- id: flydsl_fp8_gemm_playbook
  file: skills/flydsl_fp8_gemm_playbook/skill.md
  scope: e2e
  match:
    operator: dense_gemm
    arch_class:
    - '*'
    gens:
    - gfx942
    dtypes:
    - fp8_e4m3_fnuz
    regimes:
    - prefill
    - decode
    to_backend: flydsl
    profile_signature:
      op_name_regex: gemm_a8w8_blockscale|down_proj
      min_pct_gpu: 10.0
  expects:
    e2e_delta_min_pct: 1.0
    parity: required
  validation_status: validated
- id: flydsl_prefill_moe_stage2_fp8partial
  file: skills/flydsl_prefill_moe_stage2_fp8partial/skill.md
  scope: kernel
  match:
    operator: grouped_gemm_moe
    arch_class:
    - '*'
    gens:
    - gfx950
    dtypes:
    - mxfp4
    - fp4_e2m1
    - fp8_e4m3
    - fp8_e4m3_fnuz
    regimes:
    - prefill
    from_backend: ''
    to_backend: ''
    profile_signature:
      op_name_regex: ''
      min_pct_gpu: 0.0
  expects:
    isolated_speedup_min: 1.15
    isolated_scope: 'stage-2 SEGMENT = the down-proj GEMM kernel PLUS the separate top-k reduce kernel,
      summed. Do NOT score the GEMM kernel alone: ~75% of the win is the halved partial READ, which happens
      in the reduce kernel, so a GEMM-only measurement tops out at a measured 1.053x and fails this gate
      even when the recipe is correctly reproduced. A per-kernel timing filter matched on the GEMM name
      will not match the reduce kernel name -- verify your filter catches both.'
    e2e_delta_min_pct: 1.0
    parity: relaxed
  validation_status: validated
- id: flydsl_rewrite_quantized_moe
  file: skills/flydsl_rewrite_quantized_moe/skill.md
  scope: kernel
  match:
    operator: fused_moe_grouped_gemm
    arch_class:
    - '*'
    gens:
    - gfx942
    dtypes:
    - int4_w4a16
    - fp8_e4m3_fnuz
    regimes:
    - prefill
    - decode
    from_backend: triton
    to_backend: flydsl
    profile_signature:
      op_name_regex: ''
      min_pct_gpu: 0.0
  expects:
    isolated_speedup_min: 1.5
    e2e_delta_min_pct: 1.0
    parity: required
  validation_status: validated
- id: gluon_authoring
  file: skills/gluon_authoring/skill.md
  scope: kernel
  match:
    operator: '*'
    arch_class:
    - '*'
    gens:
    - gfx942
    - gfx950
    dtypes:
    - bf16
    - fp16
    - fp8_e4m3_fnuz
    - fp8_e4m3
    regimes:
    - '*'
    from_backend:
    - triton
    - gluon
    to_backend: gluon
  expects:
    isolated_speedup_min: 1.1
    parity: required
  validation_status: draft
- id: mla_tilelang_to_triton
  file: skills/mla_tilelang_to_triton/skill.md
  scope: kernel
  match:
    operator: mla_attention
    arch_class:
    - deepseek_mla
    gens:
    - gfx942
    dtypes:
