schema_version: expert-skill-contract-v1
skill_id: megamoe_ep_mega_fusion

source:
  include:
    - '**/*moe*.py'
    - '**/gemm*.py'
    - '**/*dispatch*combine*.py'
    - '**/*quant*.py'
  exclude:
    - '3rdparty/**'

binding_policy:
  authority: analyze
  names_are_normative: false
  source_checks_are_profile_adapter_hints: true
  adapter_hint_failures_block_applicability: false
  adapter_scope: validated_megamoe_ep8_gfx950_profile_only
  adapter_selection: analyze_discovered_semantic_bindings
  applicability_owner: workflow
  applicability_failures_block_compatibility: false

activation:
  scope: post_selection_claimed_complete_structural_checkpoint
  requires_selected_or_pinned_skill: true
  required_checks_define_claimed_implementation_completeness: true

provenance:
  require_manifest: true

plan:
  required: true
  assertions:
    - {id: plan_v2, path: plan_version, op: eq, value: mega-plan-v2}
    - {id: two_launch_target, path: target.launch_count, op: eq, value: 2}
    - {id: target_arch, path: resources.arch, op: eq, value: gfx950}
    - {id: combine_in_kernel, path: schedule.policies.combine_transition, op: eq, value: after_local_g1_g2_drain_without_grid_barrier}
    - {id: unified_semantic_loop, path: schedule.policies.scheduler_semantics, op: eq, value: continuation_then_skew_mod6_ready_g2_else_g1_then_blocking_g2_contiguous_c1_c16}
    - {id: direct_runtime_combine_item, path: schedule.policies.combine_semantics, op: eq, value: runtime_p_direct_per_wave_wait_block_claim_one_system19_u1_u2_u4}
    - {id: group_segment_within_gfx950, left: {path: resources.local_memory.total_bytes}, op: lte, right: {path: resources.local_memory.limit_bytes}}

# These probes describe the validated profile's present adapter only. Paths
# and symbols are not applicability gates. After Analyze selects this adapter
# by semantic bindings and the workflow selects/pins the Skill, the required
# implementation checks are required evidence for a claimed-complete
# structural checkpoint.
#
# tier: semantic = a behavior-level invariant whose violation changes
# correctness, liveness or performance structure (work-unit granularity, claim
# mapping, publication relations, scheduler order/skew, counter domains and
# lifecycle, launch topology, transport single-source, cache policy, LDS
# lifetime aliasing). tier: surface = host ABI/plumbing spelling, helper names
# and reachability-by-name.
checks:
  - id: complete_host_path
    category: plan
    tier: semantic
    severity: required
    kind: selected_branch_calls
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_v2.py
    scope: MegaMoEV2._run_joint
    condition: '^(?:mega|.*AITER_MEGAMOE_FUSE_ALL.*)$'
    arm: body
    required_calls: ['_run_fused_stage1']
    forbidden_calls:
      - '_run_stage2'
      - '_run_fused_stage2'
      - 'run_mega_moe_stage2'
      - 'combine_no_stage1'
    require_return: true

  - id: fused_host_abi
    category: abi
    tier: surface
    severity: required
    kind: value_flow
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_v2.py
    scope: MegaMoEV2._fused_all_kwargs
    normalize_wrappers: [fx.Int32, fx.Int64]
    relations:
      - id: exact_stage2_runtime_roots
        op: tuple_elements
        target: args
        length: 13
        min_distinct: 13
        values:
          - self\._s1_out\.view\(-1\)\.data_ptr\(\)
          - self\._s1_osd\.data_ptr\(\)
          - self\.w2\.data_ptr\(\)
          - self\.w2_scale\.data_ptr\(\)
          - op\.sorted_expert_ids\.data_ptr\(\)
          - op\.num_valid\.data_ptr\(\)
          - 'self\._s1_dispatch_workspace\[[''"]max_expert_tiles[''"]\]\.data_ptr\(\)'
          - op\.srcmap_em\.data_ptr\(\)
          - op\.wts_em\.data_ptr\(\)
          - op\.tile_row_base\.data_ptr\(\)
          - comb_op\._fx_p2p_comb_inp
          - self\._fx_fused_mtile_ctr
          - max_m_blocks
      - id: exact_combine_runtime_roots
        op: tuple_elements
        target: c_args
        length: 7
        min_distinct: 7
        values:
          - comb_op\._fx_comb_inp
          - comb_op\._fx_comb_out
          - comb_op\._fx_tok_ready
          - self\._fx_fused_comb_ctr
          - comb_op\._fx_p2p_tok_ready
          - self\._fx_fused_comb_mtile_ctr
          - self\._fx_fused_comb_wait_stats
      - id: correct_max_m_blocks
        op: count
        count: 1
        select:
          node: assign
          target: max_m_blocks
          value: '\(self\._s1_nvm \+ stage2\.block_m - 1\) // stage2\.block_m'
      - id: stage2_spec_is_authoritative
        op: mapping_entries
        mapping: {node: assign, target: s2_spec}
        entries:
          BM: stage2\.block_m
          BN: stage2\.block_n
          BK: stage2\.block_k
          SBM: config\.stage1\.sort_block_m
          publish_tok_ready: bool\(fuse_combine\)
      - id: combine_control_allocated
        op: count
        scope: MegaMoEV2._build_fused_stage2
        count: 1
        select:
          node: assign
          target: self\._fused_comb_ctr
          value: 'torch\.zeros\(4, dtype=torch\.int32, device=dev\)'
      - id: g2_activation_arena_allocated
        op: count
        scope: MegaMoEV2._build_fused_stage1
        count: 1
        select:
          node: assign
          target: self\._s1_out
          value: torch\.zeros
          search: true
      - id: g2_scale_arena_allocated
        op: count
        scope: MegaMoEV2._build_fused_stage1
        count: 1
        select:
          node: assign
          target: self\._s1_osd
          value: torch\.zeros
          search: true
      - id: g1_completion_allocated
        op: count
        scope: MegaMoEV2._build_fused_stage2
        count: 1
        select:
          node: assign
          target: self\._fused_mtile_ctr
          value: torch\.zeros
          search: true
      - id: g2_close_allocated
        op: count
        scope: MegaMoEV2._build_fused_stage2
        count: 1
        select:
          node: assign
          target: self\._fused_comb_mtile_ctr
          value: torch\.zeros
          search: true
      - id: combine_receiver_attributes_exist
        op: definite_attributes
        file: aiter/ops/flydsl/kernels/flydsl_dispatch_combine_intranode_op.py
        scope: FlyDSLDispatchCombineIntraNodeOp.__init__
        class: FlyDSLDispatchCombineIntraNodeOp
        attributes:
          - _fx_comb_inp
          - _fx_comb_out
          - _fx_tok_ready
          - _fx_p2p_tok_ready
          - _fx_p2p_comb_inp
      - id: output_pointer_storage_provenance
        op: mapping_entries
        file: aiter/ops/flydsl/kernels/flydsl_dispatch_combine_intranode_op.py
        scope: FlyDSLDispatchCombineIntraNodeOp.__init__
        mapping: {node: assign, target: _fx_srcs}
        entries:
          _fx_comb_out: self\.shmem_comb_out_tok
      - id: returned_output_uses_kernel_root
        op: count
        scope: MegaMoEV2._run_joint
        count: 1
        select:
          node: attribute
          value: self\.comb_op\.shmem_comb_out_tok

  - id: selected_fused_host_bindings
    category: abi
    tier: surface
    severity: required
    kind: call_keywords
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_v2.py
    scope: MegaMoEV2._run_joint
    call: _run_fused_stage1
    keywords:
      fused_config: '^config$'
      fuse_combine: '^fuse_comb$'

  - id: fused_bundle_flow
    category: abi
    tier: surface
    severity: required
    kind: bundle_flow
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_v2.py
    scope: MegaMoEV2._run_fused_stage1
    producer_call: _fused_all_kwargs
    outputs: [_s2_spec, _s2_args, _c_spec, _c_args]
    bundle_target: _fused_kw
    keys:
      fused_stage2: _s2_spec
      fused_args: _s2_args
      fused_combine: _c_spec
      fused_combine_args: _c_args
    sink_call: _s1_mega

  - id: persistent_kernel_abi
    category: abi
    tier: surface
    severity: required
    kind: function_shape
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_stage1.py
    scope: compile_mega_moe_stage1.kernel
    min_parameters: 38
    min_loaded_parameters: 38

  - id: fused_launch_abi
    category: abi
    tier: surface
    severity: required
    kind: value_flow
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_stage1.py
    scope: run_mega_moe_stage1
    relations:
      - id: all_fused_parameters_consumed
        op: parameters_used
        parameters: ['fused_.*']
        min_parameters: 9
      - id: stage2_spec_reaches_compile
        op: depends
        sink: {node: call, call: compile_mega_moe_stage1}
        keyword: fused_stage2
        source: fused_stage2
      - id: combine_spec_reaches_compile
        op: depends
        sink: {node: call, call: compile_mega_moe_stage1}
        keyword: fused_combine
        source: fused_combine
      - id: runtime_chunk_reaches_compile
        op: depends
        sink: {node: call, call: compile_mega_moe_stage1}
        keyword: fused_g2_chunk
        source: fused_g2_chunk
      - id: stage2_abi_reaches_launch
        op: depends
        sink: {node: call, call: _run_compiled}
        star_arg: 0
        source: fused_args
      - id: combine_abi_reaches_launch
        op: depends
        sink: {node: call, call: _run_compiled}
        star_arg: 1
        source: fused_combine_args
      - id: launch_abi_group_order
        op: starred_arguments
        call: {node: call, call: _run_compiled}
        values: [fa, ca, qa]
      - id: cached_specs_are_hashable
        op: cached_call_hashable
        call: {node: call, call: compile_mega_moe_stage1}
        keywords: [fused_stage2, fused_combine]
      - id: compile_target_is_cached
        op: count
        scope: compile_mega_moe_stage1
        count: 1
        select:
          node: function
          name: compile_mega_moe_stage1
          decorators: ['functools\.cache']

  - id: host_specializes_g2_chunk
    category: profile_adapter_hint
    tier: semantic
    severity: advisory
    kind: regex
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_v2.py
    patterns:
      - '[''"]16[''"]\s+if\s+cur_tok\s*>=\s*4096\s+else\s+[''"]1[''"]'

  - id: stage2_active_compile_flow
    category: compiler
    tier: semantic
    severity: required
    kind: value_flow
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_stage1.py
    scope: compile_mega_moe_stage1
    normalize_wrappers: [fx.Int32, fx.Int64]
    relations:
      - id: host_spec_owns_nw_and_transport
        op: any_of
        file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_v2.py
        alternatives:
          - id: stage2_spec_carries_nw_and_transport
            relations:
              - op: mapping_entries
                scope: MegaMoEV2._fused_all_kwargs
                mapping: {node: assign, target: s2_spec}
                entries:
                  NW: 'int\(config\.stage1\.num_waves\)'
                  p2p_quant: 'str\(p2p_quant\)'
          - id: transport_keyed_invariants_and_stage1_waves
            relations:
              - op: depends
                scope: MegaMoEV2._fused_all_kwargs
                sink: {node: assign, target: s2_spec}
                source: '_g2_invariants_by_quant\[config\.p2p_quant\]'
              - op: mapping_entries
                scope: MegaMoEV2._build_fused_stage2
                mapping: {node: assign, target: 'self\._g2_invariants_by_quant\[p2p_quant\]'}
                entries:
                  p2p_quant_type: p2p_quant
              - op: count
                scope: MegaMoEV2._run_fused_stage1
                count: 1
                select:
                  node: call
                  call: _s1_mega
                  star_keywords: 1
                  keywords: {num_waves: '(?:(?:fused_)?config\.stage1|config|stage1)\.num_waves'}
      - id: host_nw_reaches_emitter_constants
        op: any_of
        alternatives:
          - id: nw_keyword_from_host_selection
            relations:
              - op: depends
                sink: {node: call, call: derive_stage2_emit_constants}
                keyword: NW
                source: '\b(?:s2_kw|num_waves)\b'
          - id: nw_entry_from_host_waves_expanded_into_constants
            relations:
              - op: depends
                sink: {node: assign, target: 's2_kw\[[''"]NW[''"]\]'}
                source: '\bnum_waves\b'
              - op: ordered
                selectors:
                  - {node: assign, target: 's2_kw\[[''"]NW[''"]\]'}
                  - {node: call, call: derive_stage2_emit_constants}
              - op: depends
                sink: {node: call, call: derive_stage2_emit_constants}
                star_keyword: true
                source: '^s2_kw$'
      - id: host_transport_reaches_emitter_constants
        op: any_of
        alternatives:
          - id: transport_keyword_from_host_spec
            relations:
              - op: depends
                sink: {node: call, call: derive_stage2_emit_constants}
                keyword: p2p_quant_type
                source: '\b(?:s2_kw|fused_stage2)\b'
          - id: host_spec_expanded_into_constants
            relations:
              - op: depends
                sink: {node: call, call: derive_stage2_emit_constants}
                star_keyword: true
                source: '\bfused_stage2\b'
              - op: count
                count: 0
                select: {node: assign, target: 's2_kw\[[''"]p2p_quant_type[''"]\]'}
      - id: combine_decode_uses_producer_transport
        op: any_of
        alternatives:
          - id: decode_from_compiled_producer_transport
            relations:
              - op: depends
                sink: {node: call, call: _combine_transport_spec}
                keyword: blockwise_fp8_transport
                source: _p2p_quant_type
          - id: decode_and_producer_share_host_transport
            relations:
              - op: depends
                sink: {node: call, call: _combine_transport_spec}
                keyword: blockwise_fp8_transport
                source: '\bfused_combine\b'
              - op: mapping_entries
                file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_v2.py
                scope: MegaMoEV2._fused_all_kwargs
                mapping: {node: assign, target: c_spec}
                entries:
                  blockwise_fp8_transport: '(?:config\.p2p_quant|p2p_quant|str\((?:config\.)?p2p_quant\)) == [''"]fp8_blockwise_1x32[''"]'
              - op: depends
                file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_v2.py
                scope: MegaMoEV2._fused_all_kwargs
                sink: {node: assign, target: s2_spec}
                source: '_g2_invariants_by_quant\[config\.p2p_quant\]'
      - id: a_loader_partitions_rows_by_nw
        op: count
        file: aiter/ops/flydsl/kernels/mega_moe/gemm2.py
        scope: issue_a_load_lds_dt
        count: 1
        select: {node: assign, target: rows_per_wave, value: BM // NW}
      - id: recurring_a_prefetch_receives_nw
        op: any_of
        alternatives:
          - id: kloop_prefetch_receives_nw
            relations:
              - op: depends
                file: aiter/ops/flydsl/kernels/mega_moe/gemm2.py
                scope: gemm2_compute_v2
                sink: {node: call, call: issue_a_load_lds_dt}
                keyword: NW
                source: NW
          - id: per_unit_a_prologue_receives_nw
            relations:
              - op: within_count
                file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_stage2.py
                scope: make_stage2_body_emitter.emit_stage2_body._emit_stage2_body
                region: {node: function, name: issue_all_a_loads}
                count: 1
                select: {node: call, call: issue_a_load_lds_dt, keywords: {NW: NW}}
      - id: b_scale_wave_stride_depends_on_nw
        op: depends
        file: aiter/ops/flydsl/kernels/mega_moe/gemm2.py
        scope: gemm2_compute_v2
        sink: {node: assign, target: mni_base}
        source: NW
      - id: scatter_rows_partition_by_nw
        op: count
        file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_stage2.py
        scope: p2p_scatter_epilog
        count: 1
        select:
          node: assign
          target: row
          value: 'wave \+ row_iter \* NW'

  - id: flat_stripe_completion
    category: correctness
    tier: semantic
    severity: required
    kind: structured_cfg
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_stage1.py
    scope: compile_mega_moe_stage1.kernel
    normalize_wrappers: [fx.Int32, fx.Int64]
    relations:
      - id: one_flat_g1_execute
        op: count
        count: 1
        select: {node: call, call: _do_scheduled_tile, args: ['unit'], guard: 'kind == 1'}
      - id: completion_is_exactly_once
        op: exclusive_effect
        select:
          node: call
          call: atomic_add_system
          args: ['g2_ctr_i64 \+ unit // n_tiles_i32 \* 4', '1']
      - id: shipped_completion_release_order
        op: ordered
        selectors:
          - {node: call, call: s_waitcnt, args: ['0'], guard: 'const_expr\(not fused_diag_nopub\)'}
          - {node: call, call: barrier, guard: 'const_expr\(not fused_diag_nopub\)'}
          - {node: call, call: atomic_add_system, args: ['g2_ctr_i64 \+ unit // n_tiles_i32 \* 4', '1'], guard: 'const_expr\(not fused_diag_nopub\)'}
      - id: completion_follows_g1
        op: all_precede
        first: {node: call, call: _do_scheduled_tile, args: ['unit']}
        second:
          node: call
          call: atomic_add_system
          args: ['g2_ctr_i64 \+ unit // n_tiles_i32 \* 4', '1']

  - id: g1_cache_builder_flow
    category: correctness
    tier: semantic
    severity: required
    kind: value_flow
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_stage1.py
    scope: compile_mega_moe_stage1.kernel
    normalize_wrappers: [fx.Int32, fx.Int64]
    relations:
      - id: cache17_definition
        op: count
        scope: ''
        count: 1
        select: {node: assign, target: _G1_OUT_WT, value: '1 \| 16'}
      - id: selected_cache_reaches_builder
        op: depends
        sink:
          node: call
          call: build_fused_gemm1
          keywords: {out_cache_modifier: '0 if S2 is None else _G1_OUT_WT'}
        keyword: out_cache_modifier
        source: _G1_OUT_WT

  - id: g1_cache_epilogue_flow
    category: correctness
    tier: semantic
    severity: required
    kind: value_flow
    file: aiter/ops/flydsl/kernels/mega_moe/gemm1.py
    scope: build_fused_gemm1
    relations:
      - id: builder_parameter_reaches_epilogue
        op: depends
        sink:
          node: call
          call: SiluQuantEpilogue
          keywords: {out_cache_modifier: out_cache_modifier}
        keyword: out_cache_modifier
        source: out_cache_modifier

  - id: g1_cache_store_sink
    category: correctness
    tier: semantic
    severity: required
    kind: value_flow
    file: aiter/ops/flydsl/kernels/mega_moe/gemm_util.py
    scope: SiluQuantEpilogue.store
    relations:
      - id: activation_and_scale_stores_use_cache
        op: all_calls_match
        call: _buffer_store
        min: 2
        keywords: {cache_modifier: self\._out_cache_modifier}

  - id: unified_g1_g2_loop
    category: schedule
    tier: semantic
    severity: required
    kind: structured_cfg
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_stage1.py
    scope: compile_mega_moe_stage1.kernel
    normalize_wrappers: [fx.Int32, fx.Int64]
    relations:
      - id: unique_consumer_loop
        op: count
        count: 1
        select: {node: while, test: consumer_active, guard: 'const_expr\(S2 is None\)', guard_arm: orelse}
      - id: discriminator_zero
        op: count
        count: 1
        select: {node: assign, target: kind, value: '0'}
      - id: discriminator_g1
        op: count
        count: 1
        select: {node: assign, target: kind, value: '1'}
      - id: discriminator_g2
        op: count
        count: 3
        select: {node: assign, target: kind, value: '2'}
      - id: g1_execute_guarded
        op: guarded
        subject: {node: call, call: _do_scheduled_tile, args: ['unit']}
        guard: kind == 1
      - id: g2_execute_guarded
        op: guarded
        subject: {node: call, call: .*, guard: 'kind == 2'}
        guard: kind == 2
      - id: loop_liveness_from_discriminator
        op: count
        count: 1
        select: {node: assign, target: consumer_active, value: 'kind != 0'}

  - id: g2_scheduler_cfg
    category: schedule
    tier: semantic
    severity: required
    kind: structured_cfg
    file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_stage1.py
    scope: compile_mega_moe_stage1.kernel
    normalize_wrappers: [fx.Int32, fx.Int64]
    relations:
      - id: dependent_extent
        op: count
        count: 1
        select:
          node: assign
          target: total_g2_pairs
          value: total_m_blocks2 \* s2_num_n // s2_halves
      - id: dependent_extent_not_g1
        op: different_value
        left: {node: assign, target: total_g2_pairs}
        right: {node: assign, target: total_work}
      - id: chunk_claim_extent
        op: count
        count: 1
        select:
          node: assign
          target: total_g2_claims
          value: ceildiv\(total_g2_pairs, g2_chunk\)
      - id: compile_chunk_from_runtime_parameter
        op: count
        scope: compile_mega_moe_stage1
        count: 1
        select:
          node: assign
          target: G2_CHUNK
          value: max\(1, int\(fused_g2_chunk\)\)
      - id: c1_c16_host_mapping
        op: count
        file: aiter/ops/flydsl/kernels/mega_moe/mega_moe_v2.py
        scope: MegaMoEV2._run_fused_stage1
        count: 1
        select:
          node: assign
          target: _fused_kw
          value: '[''"]16[''"] if cur_tok >= 4096 else [''"]1[''"]'
          search: true
      - id: sharded_claim_mapping
        op: count
        count: 1
        select:
          node: return
          value: work_shard \+ local \* WORK_SHARDS
      - id: sharded_head_address
        op: count
        count: 1
        select:
          node: assign
          target: g2_head
          value: 's2_ctr \+ i32_s2_maxmb \* 4 \+ work_shard \* 64'
      - id: contiguous_chunk_base
        op: count
        count: 1
        select: {node: return, value: claim \* g2_chunk}
      - id: continuation_transition
        op: ordered
        selectors:
          - {node: assign, target: kind, value: '2', guard: 'g2_pend > 0'}
